<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />

<title>Lucovisa Visit Card</title>
<meta name="description" content="This is my visit card site for viewing my projects - frontend, game dev and web tools by Lucovisa." />
<meta name="keywords" content="луковица, lucovisa, github, гитхаб, программист, визитная карточка, разработка игр, game dev, frontend, web development, SEO, портфолио, portfolio" />
<meta name="author" content="Lucovisa" />
<meta name="robots" content="index, follow" />

<link rel="canonical" href="https://lucovisa.github.io/Lucovisa/" />

<meta name="theme-color" content="#171A21" />
<meta name="color-scheme" content="dark light" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Lucovisa Visit Card" />
<meta property="og:title" content="Lucovisa Visit Card" />
<meta property="og:description" content="This is my visit card site for viewing my projects - frontend, game dev and web tools by Lucovisa." />
<meta property="og:image" content="https://lucovisa.github.io/Lucovisa/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://lucovisa.github.io/Lucovisa/" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Lucovisa Visit Card" />
<meta name="twitter:description" content="This is my visit card site for viewing my projects." />
<meta name="twitter:image" content="https://lucovisa.github.io/Lucovisa/preview.png" />

<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="desktop" id="desktop">

  <div class="desktop__icons" id="desktop-icons" data-size="medium">

    <button class="app-icon" data-app="portfolio" data-icon="portfolio">
      <span class="app-icon__svg" data-svg="folder"></span>
      <span data-i18n="app.portfolio">Portfolio</span>
    </button>

    <button class="app-icon" data-app="about" data-icon="about">
      <span class="app-icon__svg" data-svg="info"></span>
      <span data-i18n="app.about">About me</span>
    </button>

    <button class="app-icon" data-app="hacker" data-icon="hacker">
      <span class="app-icon__svg" data-svg="terminal"></span>
      <span>hacker.exe</span>
    </button>

    <button class="app-icon" data-app="map" data-icon="map">
      <span class="app-icon__svg" data-svg="web"></span>
      <span data-i18n="app.map">Map</span>
    </button>

    <button class="app-icon" data-app="contact" data-icon="contact">
      <span class="app-icon__svg" data-svg="mail"></span>
      <span data-i18n="app.contact">Contact</span>
    </button>

    <button class="app-icon" data-app="comments" data-icon="comments">
      <span class="app-icon__svg" data-svg="comment"></span>
      <span data-i18n="app.comments">Comments</span>
    </button>

    <button class="app-icon" data-app="donate" data-icon="donate">
      <span class="app-icon__svg" data-svg="heart"></span>
      <span data-i18n="app.donate">Donate</span>
    </button>

    <button class="app-icon" data-app="trash" data-icon="trash" data-drop="trash">
      <span class="app-icon__svg" data-svg="trash"></span>
      <span data-i18n="app.trash">Trash</span>
    </button>

    <button class="app-icon" data-app="personalization" data-icon="personalization">
      <span class="app-icon__svg" data-svg="settings"></span>
      <span data-i18n="app.personalization">Personalization</span>
    </button>

    <button class="app-icon" data-app="achievements" data-icon="achievements">
      <span class="app-icon__svg" data-svg="trophy"></span>
      <span data-i18n="app.achievements">Achievements</span>
    </button>

    <button class="app-icon" data-app="arcade" data-icon="arcade">
      <span class="app-icon__svg" data-svg="joystick"></span>
      <span data-i18n="app.arcade">Arcade</span>
    </button>

    <button class="app-icon" data-app="work" data-icon="work">
      <span class="app-icon__svg" data-svg="trophy"></span>
      <span data-i18n="app.work">Work</span>
    </button>

  </div>

  <div class="windows-layer" id="windows-layer"></div>

  <div class="taskbar">
    <button class="taskbar__start" id="start-btn" aria-label="Start">
      <img src="icon.png" alt="" id="start-avatar" />
    </button>

    <div class="taskbar__apps" id="taskbar-apps"></div>

    <div class="taskbar__tray">
      <div class="toggle lang-toggle" role="group" aria-label="Language">
        <button class="toggle__btn" data-lang="en">EN</button>
        <button class="toggle__btn" data-lang="ru">RU</button>
      </div>
      <div class="toggle theme-toggle" role="group" aria-label="Theme">
        <button class="toggle__btn" data-theme="light" aria-label="Light"><span class="app-icon__svg app-icon__svg--sm" data-svg="sun"></span></button>
        <button class="toggle__btn" data-theme="dark" aria-label="Dark"><span class="app-icon__svg app-icon__svg--sm" data-svg="moon"></span></button>
      </div>
      <button class="taskbar__clock" id="clock" title="Calendar">--:--:--</button>
    </div>
  </div>

  <div class="start-menu" id="start-menu">
    <div class="start-menu__header">
      <button class="start-menu__avatar" id="start-menu-avatar" title="Change avatar">
        <img src="icon.png" alt="" id="start-menu-avatar-img" />
      </button>
      <div class="start-menu__user">
        <span class="start-menu__label" data-i18n="taskbar.start">Start</span>
        <span class="start-menu__name" id="start-username">User</span>
      </div>
      <button class="start-menu__edit" id="edit-username" title="Change name">✏️</button>
    </div>
    <input type="file" id="avatar-file" accept="image/*" hidden />
    <input type="file" id="wallpaper-file" accept="image/*" hidden />
    <button class="start-menu__item" data-app="portfolio">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="folder"></span>
      <span data-i18n="app.portfolio">Portfolio</span>
    </button>
    <button class="start-menu__item" data-app="about">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="info"></span>
      <span data-i18n="app.about">About me</span>
    </button>
    <button class="start-menu__item" data-app="hacker">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="terminal"></span>
      <span>hacker.exe</span>
    </button>
    <button class="start-menu__item" data-app="map">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="web"></span>
      <span data-i18n="app.map">Map</span>
    </button>
    <button class="start-menu__item" data-app="contact">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="mail"></span>
      <span data-i18n="app.contact">Contact</span>
    </button>
    <button class="start-menu__item" data-app="comments">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="comment"></span>
      <span data-i18n="app.comments">Comments</span>
    </button>
    <button class="start-menu__item" data-app="donate">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="heart"></span>
      <span data-i18n="app.donate">Donate</span>
    </button>
    <button class="start-menu__item" data-app="trash">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="trash"></span>
      <span data-i18n="app.trash">Trash</span>
    </button>
    <button class="start-menu__item" data-app="personalization">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="settings"></span>
      <span data-i18n="app.personalization">Personalization</span>
    </button>
    <button class="start-menu__item" data-app="achievements">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="trophy"></span>
      <span data-i18n="app.achievements">Achievements</span>
    </button>
    <button class="start-menu__item" data-app="arcade">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="joystick"></span>
      <span data-i18n="app.arcade">Arcade</span>
    </button>
    <button class="start-menu__item" data-app="work">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="trophy"></span>
      <span data-i18n="app.work">Work</span>
    </button>
    <button class="start-menu__item" data-app="calendar">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="calendar"></span>
      <span data-i18n="app.calendar">Calendar</span>
    </button>
    <button class="start-menu__item" id="wallpaper-btn">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="wallpaper"></span>
      <span data-i18n="taskbar.wallpaper">Set wallpaper</span>
    </button>
    <div class="start-menu__sep"></div>
    <button class="start-menu__item" id="about-system-btn">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="infoCircle"></span>
      <span data-i18n="system.about">About system</span>
    </button>
    <button class="start-menu__item" id="restart-btn">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="restart"></span>
      <span data-i18n="system.restart">Restart</span>
    </button>
    <button class="start-menu__item start-menu__item--danger" id="shutdown-btn">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="power"></span>
      <span data-i18n="system.shutdown">Shut down</span>
    </button>
  </div>

  <div class="context-menu" id="context-menu">
    <button class="context-menu__item" data-action="refresh">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="refresh"></span>
      <span data-i18n="context.refresh">Refresh</span>
    </button>
    <div class="context-menu__sep"></div>
    <button class="context-menu__item" data-action="shortcut">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="shortcut"></span>
      <span data-i18n="context.createShortcut">Create shortcut</span>
    </button>
    <button class="context-menu__item" data-action="personalization">
      <span class="app-icon__svg app-icon__svg--sm" data-svg="settings"></span>
      <span data-i18n="context.personalization">Personalization</span>
    </button>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal__titlebar" data-drag-modal>
        <span class="modal__icon"></span>
        <span class="modal__title" id="modal-title">Message</span>
        <div class="modal__buttons">
          <button class="btn btn--close" id="modal-close" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__footer">
        <button class="pill pill--ghost" id="modal-cancel" data-i18n="modal.cancel">Cancel</button>
        <button class="pill" id="modal-ok" data-i18n="modal.ok">OK</button>
      </div>
    </div>
  </div>

  <div class="boot-screen" id="boot-screen">
    <div class="boot-screen__inner">
      <div class="boot-screen__logo">LUCOS</div>
      <div class="boot-screen__text">Loading LUCOS...</div>
      <div class="boot-screen__bar"><div class="boot-screen__fill" id="boot-fill"></div></div>
      <div class="boot-screen__welcome" id="boot-welcome"></div>
    </div>
  </div>

  <div class="achievement-layer" id="achievement-layer"></div>

  <div class="toast-layer" id="toast-layer"></div>

</div>

<template id="window-template">
  <div class="window" data-app="">
    <div class="window__titlebar" data-drag>
      <span class="window__icon"></span>
      <span class="window__title"></span>
      <div class="window__buttons">
        <button class="btn btn--min" data-action="min" aria-label="Minimize">_</button>
        <button class="btn btn--max" data-action="max" aria-label="Maximize">□</button>
        <button class="btn btn--close" data-action="close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="window__body"></div>
  </div>
</template>

<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/dates.js"></script>
<script src="js/arcade.js"></script>
<script src="js/apps.js"></script>
<script src="js/achievements.js"></script>
<script src="js/giscus.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/main.js"></script>
</body>
</html>
