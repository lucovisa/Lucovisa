<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />

<title>Lucovisa Visit card</title>
<meta name="description" content="This is my visit card site for viewing my projects - frontend, game dev and web tools by Lucovisa." />
<meta name="keywords" content="луковица, lucovisa, github, гитхаб, программист, визитная карточка, разработка игр, game dev, frontend, web development, SEO, портфолио, portfolio" />
<meta name="author" content="Lucovisa" />
<meta name="robots" content="index, follow" />

<link rel="canonical" href="https://lucovisa.github.io/" />

<meta name="theme-color" content="#171A21" />
<meta name="color-scheme" content="dark light" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Lucovisa Visit card" />
<meta property="og:title" content="Lucovisa Visit card" />
<meta property="og:description" content="This is my visit card site for viewing my projects - frontend, game dev and web tools by Lucovisa." />
<meta property="og:image" content="https://lucovisa.github.io/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://lucovisa.github.io/" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Lucovisa Visit card" />
<meta name="twitter:description" content="This is my visit card site for viewing my projects." />
<meta name="twitter:image" content="https://lucovisa.github.io/preview.png" />

<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="desktop" id="desktop">

  <div class="desktop__icons" id="desktop-icons">

    <button class="app-icon" data-app="portfolio">
      <img src="icon.png" alt="" />
      <span data-i18n="app.portfolio">Portfolio</span>
    </button>

    <button class="app-icon" data-app="about">
      <img src="images.png" alt="" />
      <span data-i18n="app.about">About me</span>
    </button>

    <button class="app-icon" data-app="hacker">
      <img src="https://lucovisa.github.io/SQL-in-image/favicon.png" alt="" />
      <span>hacker.exe</span>
    </button>

    <button class="app-icon" data-app="map">
      <img src="sitemap.png" alt="" />
      <span data-i18n="app.map">Map</span>
    </button>

    <button class="app-icon" data-app="contact">
      <img src="contacs.png" alt="" />
      <span data-i18n="app.contact">Contact</span>
    </button>

    <button class="app-icon" data-app="comments">
      <img src="comment.png" alt="" />
      <span data-i18n="app.comments">Comments</span>
    </button>

  </div>

  <div class="windows-layer" id="windows-layer"></div>

  <div class="taskbar">
    <button class="taskbar__start" id="start-btn">
      <img src="icon.png" alt="" />
      <span data-i18n="taskbar.start">Start</span>
    </button>

    <div class="taskbar__apps" id="taskbar-apps"></div>

    <div class="taskbar__tray">
      <div class="toggle lang-toggle" role="group" aria-label="Language">
        <button class="toggle__btn" data-lang="en">EN</button>
        <button class="toggle__btn" data-lang="ru">RU</button>
      </div>
      <div class="toggle theme-toggle" role="group" aria-label="Theme">
        <button class="toggle__btn" data-theme="light" aria-label="Light">☀</button>
        <button class="toggle__btn" data-theme="dark" aria-label="Dark">🌙</button>
      </div>
      <button class="taskbar__clock" id="clock" title="Click to reload">--:--:--</button>
    </div>
  </div>

  <div class="start-menu" id="start-menu">
    <div class="start-menu__header">
      <img src="icon.png" alt="" />
      <span>Lucovisa</span>
    </div>
    <button class="start-menu__item" data-app="portfolio">
      <img src="icon.png" alt="" />
      <span data-i18n="app.portfolio">Portfolio</span>
    </button>
    <button class="start-menu__item" data-app="about">
      <img src="images.png" alt="" />
      <span data-i18n="app.about">About me</span>
    </button>
    <button class="start-menu__item" data-app="hacker">
      <img src="https://lucovisa.github.io/SQL-in-image/favicon.png" alt="" />
      <span>hacker.exe</span>
    </button>
    <button class="start-menu__item" data-app="map">
      <img src="sitemap.png" alt="" />
      <span data-i18n="app.map">Map</span>
    </button>
    <button class="start-menu__item" data-app="contact">
      <img src="contacs.png" alt="" />
      <span data-i18n="app.contact">Contact</span>
    </button>
    <button class="start-menu__item" data-app="comments">
      <img src="comment.png" alt="" />
      <span data-i18n="app.comments">Comments</span>
    </button>
  </div>

</div>

<template id="window-template">
  <div class="window" data-app="">
    <div class="window__titlebar" data-drag>
      <img class="window__icon" src="" alt="" />
      <span class="window__title"></span>
      <div class="window__buttons">
        <button class="btn btn--min" data-action="min" aria-label="Minimize">_</button>
        <button class="btn btn--max" data-action="max" aria-label="Maximize">□</button>
        <button class="btn btn--close" data-action="close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="window__body"></div>
  </div>
</template>

<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/apps.js"></script>
<script src="js/giscus.js"></script>
<script src="js/main.js"></script>
</body>
</html>
